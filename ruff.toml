# Configures ruff, which replaces flake8, black and isort.
#
# This is ruff.toml and not pyproject.toml on purpose: the package is built
# from setup.py, and a pyproject.toml without a [build-system] table makes pip
# older than 25.3 build it in an isolated PEP 517 environment instead of
# running setup.py directly. If the project ever adopts a [build-system]
# table, move these settings into pyproject.toml under [tool.ruff].

# Black ran with its default width. flake8's `max-line-length = 119` was never
# enforced because E501 was ignored.
line-length = 88
# Python 3.9+ (README.rst, setup.py classifiers, CI matrix).
target-version = "py39"
# Generated by number_parser_scripts/write_complete_language_data.py (plain
# json.dumps output), plus a few later hand edits (e.g. #95). Black skipped
# this directory; flake8 and isort linted it.
extend-exclude = ["number_parser/data"]
# Also skip it when such a path is given explicitly from the repository root
# (e.g. `ruff format number_parser/data/en.py`).
force-exclude = true

[lint]
# What flake8 (E, W, F) and isort (I) checked. Plain `select`, not
# `extend-select`: ruff's default rule set is much larger than that.
# pycodestyle's layout rules (E1xx-E3xx) are mostly preview-only in ruff;
# `ruff format` enforces most of the same layout, but not everything (e.g.
# comment prefixes such as `##` or `#!`). ruff's isort defaults match isort's
# `profile = black` as of isort 6; unlike the old isort 5.11.5, they do not
# collapse an exploded import that ends with a trailing comma.
select = ["E", "W", "F", "I"]
# Ignores carried over from .flake8. W503 is dropped: ruff has no such rule and
# rejects unknown codes.
ignore = [
    "E203",  # whitespace before ":"
    "E501",  # line too long
    "E722",  # bare `except:`
    "F401",  # unused import (number_parser/__init__.py re-exports the API)
]
