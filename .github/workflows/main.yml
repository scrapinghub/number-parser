name: Build
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
permissions:
  contents: read
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            env:
              TOXENV: py
          - python-version: "3.10"
            env:
              TOXENV: py
          - python-version: "3.11"
            env:
              TOXENV: py
          - python-version: "3.12"
            env:
              TOXENV: py
          - python-version: "3.13"
            env:
              TOXENV: py
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          persist-credentials: false
      - name: 'Set up Python ${{ matrix.python-version }}'
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '${{ matrix.python-version }}'
      - name: Install language-pack-fr
        run: sudo apt-get update && sudo apt-get install language-pack-fr
      - name: Install python dependencies
        run: pip install tox
      - name: tox
        run: tox -e py
      - name: Upload coverage.xml to codecov
        if: ${{ matrix.python-version == '3.13' && matrix.env.TOXENV == 'py'}}
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3

  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      with:
        persist-credentials: false
    - uses: pre-commit/action@646c83fcd040023954eafda54b4db0192ce70507 # v3.0.0
